############################################
### Templates
############################################
x-database-template: &database-template
  restart: unless-stopped
  networks:
    - document-flow-network


x-migrate-template: &migrate-template
  image: migrate/migrate:latest
  user: "1000:1000"
  restart: "no"
  entrypoint: ["/bin/sh", "-c"]
  command: 
    - "migrate -path=/migrations -database=$$DATABASE_URL up"
  networks:
    - document-flow-network

#Healthchecks
x-broker-healthcheck: &broker-healthcheck
  interval: 10s
  timeout: 10s
  retries: 5

x-database-healthcheck: &database-healthcheck
  test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
  interval: 5s
  timeout: 5s
  retries: 5


services:

############################################
### Stateful services
############################################
  task-manager-database:
    <<: *database-template
    build:
      context: ./database/task-manager/postgres
      args:
        POSTGRES_DB: ${TASK_MANAGER_POSTGRES_DB} 
    container_name: task-manager-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${TASK_MANAGER_POSTGRES_DB}
    ports: 
      - "${TASK_MANAGER_POSTGRES_PORT}:5432"
    volumes:
      - task-manager-postgres_data:/var/lib/postgresql/data
    command: 
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=task_manager
      - -c
      - cron.log_run=false
    healthcheck:
      <<: *database-healthcheck


#если нужен отдельный сервис с базой 
  llm-worker-database:
    <<: *database-template
    image: postgres:16
    container_name: llm-worker-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${LLM_WORKER_POSTGRES_DB}
    ports:
      - "${LLM_WORKER_POSTGRES_PORT}:5432"
    volumes:
      - llm-worker-postgres_data:/var/lib/postgresql/data
    healthcheck:
      <<: *database-healthcheck

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: df-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}
    networks:
      - document-flow-network
    healthcheck:
      <<: *broker-healthcheck
      test: ["CMD", "nc", "-z", "localhost", "${ZOOKEEPER_CLIENT_PORT}"]
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: df-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_CLIENT_PORT}
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_REPLICATION_FACTOR}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS}"
    ports:
      - "${KAFKA_EXTERNAL_PORT}:9092"
    networks:
      - document-flow-network
    healthcheck:
      <<: *broker-healthcheck
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:${KAFKA_EXTERNAL_PORT}"]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: df-minio
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    networks:
      - document-flow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


############################################
### Init services
############################################
  df-minio-init:
    image: minio/mc:latest
    container_name: df-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb myminio/${DOCUMENT_FLOW_MINIO_BUCKET} --ignore-existing;
      exit 0;
      " #TODO: заменить public, на none. Для сделать доступы для сервисов, коотрые используют minio.
    networks:
      - document-flow-network
    restart: "no"


  task-manager-migrate:
    <<: *migrate-template
    container_name: task-manager-migrate
    depends_on:
      task-manager-database:
        condition: service_healthy
    environment:
      DATABASE_URL: ${TASK_MANAGER_DATABASE_URL}
    volumes:
      - ./database/task-manager/migrations:/migrations
  llm-worker-migrate:
    <<: *migrate-template
    container_name: llm-worker-migrate
    depends_on:
      llm-worker-database:
        condition: service_healthy
    environment:
      DATABASE_URL: ${LLM_WORKER_DATABASE_URL}
    volumes:
      - ./database/llm-worker/migrations:/migrations

############################################
### Stateless services
############################################
  task-manager:
    build:
      context: ./services/task-manager
      target: prod #окружения dev/prod
    container_name: app-task-manager
    depends_on:
      task-manager-database:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      df-minio-init:
        condition: service_completed_successfully
      task-manager-migrate:
        condition: service_completed_successfully
    env_file:
      - ./env/task-manager.env
    working_dir: /app
    # volumes:
    #   - ./services/task-manager/logs:/app/logs логи
    ports:
      - "${TASK_MANAGER_HTTP_PORT}:8080"
      - "${TASK_MANAGER_METRICS_PORT}:9090"
    networks:
      - document-flow-network
    restart: unless-stopped
    # logging:
    #   driver: json-file
    #   options:
    #     max-size: "10m"
    #     max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5


############################################
### UI services 
############################################
  ui-container:
    image: amir20/dozzle:latest
    container_name: ui-container
    ports:
      - "${DOZZLE_PORT}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # - ./services/task-manager/logs:/logs:ro
    networks:
      - document-flow-network

  ui-database:
    image: adminer:latest
    container_name: ui-database
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - document-flow-network

  ui-kafka:
    image: provectuslabs/kafka-ui:latest
    container_name: ui-kafka
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTER_NAME}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:${ZOOKEEPER_CLIENT_PORT}
    networks:
      - document-flow-network



#TODO рассмотреть динамическое определение томов по сервисам
volumes:
  minio_data:
  task-manager-postgres_data:
  llm-worker-postgres_data:

networks:
  document-flow-network:
    name: document-flow-network
    driver: bridge
