x-postgres-common: &postgres-common
  image: postgres:16
  restart: unless-stopped
  networks:
    - document-flow-network

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
  interval: 5s
  timeout: 5s
  retries: 5

x-kafka-common-healthcheck: &kafka-healthcheck
  interval: 10s
  timeout: 10s
  retries: 5

services:
  postgres-task-manager:
    <<: *postgres-common
    build:
      context: ./database/task-manager/postgres
    container_name: document-flow-postgres-task-manager
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TASK_MANAGER_DB}
    ports:
      - "${POSTGRES_TASK_MANAGER_PORT}:5432"
    volumes:
      - postgres_task-manager_data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck

  postgres-llm-worker:
    <<: *postgres-common
    container_name: document-flow-postgres-llm-worker
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_LLM_WORKER_DB}
    ports:
      - "${POSTGRES_LLM_WORKER_PORT}:5432"
    volumes:
      - postgres_llm-worker_data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: document-flow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}
    networks:
      - document-flow-network
    healthcheck:
      <<: *kafka-healthcheck
      test: ["CMD", "nc", "-z", "localhost", "${ZOOKEEPER_CLIENT_PORT}"]
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: document-flow-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_CLIENT_PORT}
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_REPLICATION_FACTOR}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS}"
    ports:
      - "${KAFKA_EXTERNAL_PORT}:9092"
    networks:
      - document-flow-network
    healthcheck:
      <<: *kafka-healthcheck
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:${KAFKA_EXTERNAL_PORT}"]
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: document-flow-kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTER_NAME}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:${ZOOKEEPER_CLIENT_PORT}
    networks:
      - document-flow-network

  minio:
    image: minio/minio:latest
    container_name: document-flow-minio
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    networks:
      - document-flow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: document-flow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb myminio/${MINIO_BUCKET} --ignore-existing;
      mc anonymous set download myminio/${MINIO_BUCKET};
      exit 0;
      "
    networks:
      - document-flow-network
    restart: "no"

  task-manager:
    build:
      context: ./services/task-manager
      dockerfile: Dockerfile
      target: dev
    container_name: document-flow-task-manager
    depends_on:
      postgres-task-manager:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      task-manager-migrate:
        condition: service_completed_successfully
    env_file:
      - ./env/task-manager.env
    working_dir: /app
    volumes:
      - ./services/task-manager/logs:/app/logs
    ports:
      - "${TASK_MANAGER_HTTP_PORT}:8080"
      - "${TASK_MANAGER_METRICS_PORT}:9090"
    networks:
      - document-flow-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/"]
      interval: 10s
      timeout: 5s
      retries: 5

  dozzle:
    image: amir20/dozzle:latest
    container_name: document-flow-dozzle
    ports:
      - "${DOZZLE_PORT}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./services/task-manager/logs:/logs:ro
    networks:
      - document-flow-network

  adminer:
    image: adminer:latest
    container_name: document-flow-adminer
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - document-flow-network

  task-manager-migrate:
    image: migrate/migrate:latest
    container_name: task-manager-migrate
    depends_on:
      postgres-task-manager:
        condition: service_healthy
    command: 
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-task-manager:5432/${POSTGRES_TASK_MANAGER_DB}?sslmode=disable"
      - "up"
    volumes:
      - ./database/task-manager/migrations:/migrations
    networks:
      - document-flow-network
    restart: "no"

volumes:
  minio_data:
  postgres_task-manager_data:
  postgres_llm-worker_data:

networks:
  document-flow-network:
    driver: bridge
