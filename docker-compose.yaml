# ============================================================================
# Task Manager - Main Compose File
# ============================================================================
# Управление профилями:
#   docker compose --profile prod up -d     # По умолчанию prod профиль
#   docker compose --profile dev up -d      # Dev профиль (с горячей перезагрузкой)
#   docker compose --profile standalone up  # Вся инфраструктура без приложения
#
# Инфраструктура (всегда запускается):
#   - Zookeeper, Kafka, MinIO, PostgreSQL
# ============================================================================

include:
  - path: docker-compose.common.yaml

services:
  # ============================================================================
  # Task Manager Database
  # ============================================================================
  task-manager-database:
    image: postgres:16
    container_name: tm-task-manager-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${TASK_MANAGER_POSTGRES_DB:-task_manager}
    ports:
      - "${TASK_MANAGER_POSTGRES_PORT:-5443}:5432"
    volumes:
      - task-manager-postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - task-manager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - dev
      - prod
      - standalone

  # ============================================================================
  # Database Migration
  # ============================================================================
  task-manager-migrate:
    image: migrate/migrate:latest
    container_name: tm-task-manager-migrate
    depends_on:
      task-manager-database:
        condition: service_healthy
    environment:
      DATABASE_URL: ${TASK_MANAGER_DATABASE_URL:-postgres://postgres:postgres@task-manager-database:5432/task_manager?sslmode=disable}
    volumes:
      - ./database/migrations:/migrations
    networks:
      - task-manager-network
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "migrate -path=/migrations -database=$$DATABASE_URL up"
    profiles:
      - dev
      - prod
      - standalone

  # ============================================================================
  # Task Manager Application (Prod - по умолчанию)
  # ============================================================================
  task-manager:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: tm-task-manager
    depends_on:
      task-manager-database:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      tm-minio-init:
        condition: service_completed_successfully
      task-manager-migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Server
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - SERVER_PREFORK=false
      - SERVER_TIMEOUT=30s
      - SERVER_READ_TIMEOUT=10s
      - SERVER_WRITE_TIMEOUT=10s
      - SERVER_SHUTDOWN_TIMEOUT=5s
      # Database
      - DATABASE_HOST=task-manager-database
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DATABASE_DATABASE=${TASK_MANAGER_POSTGRES_DB:-task_manager}
      - DATABASE_MAX_CONNECTIONS=25
      - DATABASE_MIN_CONNECTIONS=5
      - DATABASE_MAX_CONN_LIFETIME=1h
      - DATABASE_MAX_CONN_IDLE_TIME=30m
      # Broker (Kafka)
      - BROKER_BOOTSTRAP_SERVICE=kafka:29092
      - BROKER_CLIENT_ID=task_manager_1_client
      - BROKER_TOPICS=tasks_llm
      - BROKER_PRODUCER_ACKS=-1
      - BROKER_PRODUCER_IDEMPOTENCE=true
      - BROKER_PRODUCER_COMPRESSION=snappy
      - BROKER_PRODUCER_RETRIES=3
      - BROKER_PRODUCER_BATCH_SIZE=16384
      - BROKER_PRODUCER_LINGER_MS=10
      - BROKER_PRODUCER_MAX_FLIGHT_REQUESTS=5
      - BROKER_PRODUCER_TIMEOUT_MS=30000
      - BROKER_CONSUMER_GROUP_ID=task_llm_group
      - BROKER_CONSUMER_AUTO_COMMIT=true
      - BROKER_CONSUMER_COMMIT_INTERVAL_MS=5000
      - BROKER_CONSUMER_SESSION_TIMEOUT_MS=30000
      - BROKER_CONSUMER_HEARTBEAT_INTERVAL_MS=10000
      - BROKER_CONSUMER_MAX_POLL_RECORDS=500
      - BROKER_SECURITY_PROTOCOL=PLAINTEXT
      - BROKER_SASL_MECHANISM=
      - BROKER_SASL_USERNAME=
      - BROKER_SASL_PASSWORD=
      - BROKER_SSL_CERTIFICATE_VERIFICATION=false
      # MinIO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-documents}
      - MINIO_PREFIX=uploads
      - MINIO_USESSL=false
      - MINIO_REGION=us-east-1
      - MINIO_TIMEOUT=30s
      # Logger
      - LOGGER_LEVEL=info
      - LOGGER_FORMAT=json
      - LOGGER_MODE=stdout
      # Metrics
      - METRICS_ENABLED=true
      - METRICS_PORT=9091
      - METRICS_HOST=0.0.0.0
      - METRICS_PATH=/metrics
      # Swagger
      - SWAGGER_ENABLED=true
      - SWAGGER_PATH=/swagger
    volumes:
      - ./logs:/app/logs
    ports:
      - "${TASK_MANAGER_HTTP_PORT:-8080}:8080"
      - "8000:8000"
    networks:
      - task-manager-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - prod

  # ============================================================================
  # Task Manager Application (Dev - с volume для кода)
  # ============================================================================
  # Для dev режима используется docker-compose.dev.yaml override
  # который заменяет target на dev и добавляет volume для кода

  # ============================================================================
  # Monitoring - Postgres Exporter
  # ============================================================================
  task-manager-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: tm-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@task-manager-database:5432/${TASK_MANAGER_POSTGRES_DB:-task_manager}?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - task-manager-network
    restart: unless-stopped
    profiles:
      - dev
      - prod
      - standalone

networks:
  task-manager-network:
    name: task-manager-network
    driver: bridge

volumes:
  task-manager-postgres_data:
    name: tm-postgres-data
