# ============================================================================
# Task Manager - Base Infrastructure
# ============================================================================
# Базовая инфраструктура (БД, Kafka, MinIO, Zookeeper)
# Используется вместе с dev.yaml, prod.yaml или standalone.yaml
#
# Использование:
#   docker compose -f docker-compose/base.yaml -f docker-compose/dev.yaml --profile dev up
#   docker compose -f docker-compose/base.yaml -f docker-compose/prod.yaml --profile prod up
#   docker compose -f docker-compose/base.yaml -f docker-compose/standalone.yaml --profile standalone up
# ============================================================================

services:
  # ============================================================================
  # Zookeeper - координатор для Kafka
  # ============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tm-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME:-2000}
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - task-manager-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost $$ZOOKEEPER_CLIENT_PORT"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - dev
      - prod
      - standalone

  # ============================================================================
  # Kafka - message broker
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tm-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_CLIENT_PORT:-2181}
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_REPLICATION_FACTOR:-1}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS:-true}"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - task-manager-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - dev
      - prod
      - standalone

  # ============================================================================
  # MinIO - object storage (S3-compatible)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: tm-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - task-manager-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - dev
      - prod
      - standalone

  # ============================================================================
  # MinIO Init - создание bucket'ов
  # ============================================================================
  tm-minio-init:
    image: minio/mc:latest
    container_name: tm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb myminio/documents --ignore-existing;
      mc mb myminio/task-results --ignore-existing;
      exit 0;
      "
    networks:
      - task-manager-network
    restart: "no"
    profiles:
      - dev
      - prod
      - standalone

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  task-manager-database:
    image: postgres:16
    container_name: tm-task-manager-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${TASK_MANAGER_POSTGRES_DB:-task_manager}
    ports:
      - "${TASK_MANAGER_POSTGRES_PORT:-5443}:5432"
    volumes:
      - task-manager-postgres_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - task-manager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - dev
      - prod
      - standalone

  # ============================================================================
  # Database Migration
  # ============================================================================
  task-manager-migrate:
    image: migrate/migrate:latest
    container_name: tm-task-manager-migrate
    depends_on:
      task-manager-database:
        condition: service_healthy
    environment:
      DATABASE_URL: ${TASK_MANAGER_DATABASE_URL:-postgres://postgres:postgres@task-manager-database:5432/task_manager?sslmode=disable}
    volumes:
      - ../database/migrations:/migrations
    networks:
      - task-manager-network
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "migrate -path=/migrations -database=$$DATABASE_URL up || true"
    profiles:
      - dev
      - prod
      - standalone

  # ============================================================================
  # Postgres Exporter
  # ============================================================================
  task-manager-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: tm-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@task-manager-database:5432/${TASK_MANAGER_POSTGRES_DB:-task_manager}?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - task-manager-network
    restart: unless-stopped
    profiles:
      - dev
      - prod
      - standalone

networks:
  task-manager-network:
    name: task-manager-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  zookeeper_data:
    name: tm-zookeeper-data
  zookeeper_logs:
    name: tm-zookeeper-logs
  kafka_data:
    name: tm-kafka-data
  minio_data:
    name: tm-minio-data
  task-manager-postgres_data:
    name: tm-postgres-data
