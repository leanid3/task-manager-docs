# .gitea/workflows/developer.yaml
name: Task Manager CI/CD Pipeline

on:
  push:
    branches: [master, backend]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - List repository structure
        run: |
          echo "📁 Current directory:"
          pwd
          echo ""
          echo "📂 Repository structure:"
          ls -la
          echo ""
          echo "📂 Services directory:"
          ls -la services/ || echo "services directory not found"

      - name: Set environment variables
        run: |
          echo "IMAGE_NAME=${{ vars.HOST }}:${{ vars.PORT }}/$(echo '${{ gitea.repository }}' | tr '[:upper:]' '[:lower:]')/task-manager:latest" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ vars.HOST }}:${{ vars.PORT }}/$(echo '${{ gitea.repository }}' | tr '[:upper:]' '[:lower:]')/task-manager:${{ gitea.sha }}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: |
          cd services/task-manager
          go test ./...

      - name: Build production image
        run: |
          cd services/task-manager
          docker build \
            --target prod \
            --build-arg HTTP_PORT=8080 \
            --build-arg METRICS_PORT=9090 \
            -t ${{ env.IMAGE_TAG }} \
            -t ${{ env.IMAGE_NAME }} .

      - name: Login to registry
        run: |
          echo ${{ secrets.REGISTRY_TOKEN }} | \
          docker login ${{ vars.HOST }}:${{ vars.PORT }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Push to registry
        run: |
          docker push ${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Set environment variables
        run: |
          echo "IMAGE_NAME=${{ vars.HOST }}:${{ vars.PORT }}/$(echo '${{ gitea.repository }}' | tr '[:upper:]' '[:lower:]')/task-manager:latest" >> $GITHUB_ENV

      - name: Login to registry
        run: |
          echo ${{ secrets.REGISTRY_TOKEN }} | \
          docker login ${{ vars.HOST }}:${{ vars.PORT }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Pull latest image
        run: docker pull ${{ env.IMAGE_NAME }}

      - name: Stop old container
        run: |
          docker stop task-manager-app || true
          docker rm task-manager-app || true

      - name: Create production env file automatically
        run: |
          # Экспортируем все переменные с префиксом TASK_MANAGER_ и убираем префикс
          env | grep '^TASK_MANAGER_' | sed 's/^TASK_MANAGER_//g' > /tmp/prod.env || touch /tmp/prod.env
          
          echo "Generated env file:"
          cat /tmp/prod.env || echo "No environment variables found"

      - name: Start container
        run: |
          docker run -d \
            --name task-manager-app \
            --restart unless-stopped \
            -p ${{ vars.TASK_MANAGER_HTTP_PORT }}:8080 \
            -p ${{ vars.TASK_MANAGER_METRICS_PORT }}:9090 \
            --env-file /tmp/prod.env \
            -v /var/log/task-manager:/app/logs \
            --network document-flow-network \
            ${{ env.IMAGE_NAME }}
          rm -f /tmp/prod.env

      - name: Health check
        run: |
          echo "⏳ Waiting for service..."
          sleep 10
          
          for i in {1..30}; do
            if curl -f http://${{ vars.HOST }}:${{ vars.TASK_MANAGER_HTTP_PORT }}/health/; then
              echo "✅ Deployment successful!"
              exit 0
            fi
            echo "Attempt $i/30 failed, retrying..."
            sleep 5
          done
          
          echo "❌ Health check failed"
          docker logs task-manager-app --tail 50
          exit 1
