# ============================================================================
# Task Manager - Development Override
# ============================================================================
# Dev режим с горячей перезагрузкой кода
#
# Использование:
#   docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d
#   make up-dev
# ============================================================================

services:
  # ============================================================================
  # Task Manager Application (Dev Override)
  # ============================================================================
  task-manager:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      - .:/app
      - ./logs:/app/logs
    command: ["go", "run", "cmd/api/main.go"]
    environment:
      # Logger - более подробный для dev
      - LOGGER_LEVEL=debug
      - LOGGER_FORMAT=text
