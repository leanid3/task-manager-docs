definitions:
  TaskStatus:
    enum:
    - PENDING
    - PROCESSING
    - COMPLETED
    - FAILED
    type: string
    x-enum-varnames:
    - TaskStatusPending
    - TaskStatusProcessing
    - TaskStatusCompleted
    - TaskStatusFailed
  ErrorResponse:
    properties:
      code:
        type: string
      details:
        additionalProperties: true
        type: object
      error:
        type: string
      request_id:
        type: string
      timestamp:
        type: string
    type: object
  CreateTaskResponse:
    properties:
      request_id:
        type: string
      status:
        $ref: '#/definitions/TaskStatus'
      task_id:
        type: string
    type: object
  GetTaskResponse:
    properties:
      status:
        $ref: '#/definitions/TaskStatus'
      task_id:
        type: string
      task_results:
        additionalProperties: true
        type: object
    type: object
  SwaggerCreateTaskSuccess:
    properties:
      data:
        $ref: '#/definitions/CreateTaskResponse'
      request_id:
        type: string
      timestamp:
        type: string
    type: object
  SwaggerGetTaskSuccess:
    properties:
      data:
        $ref: '#/definitions/GetTaskResponse'
      request_id:
        type: string
      timestamp:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/tasks/{filename}:
    post:
      consumes:
      - application/octet-stream
      description: Загружает файл в бинарном формате и создает задачу на обработку.
      parameters:
      - description: 'Имя файла с расширением. Пример: document.pdf'
        in: path
        name: filename
        required: true
        type: string
      - description: Размер файла в байтах. Устанавливается автоматически при использовании
          curl --data-binary
        in: header
        name: Content-Length
        required: true
        type: integer
      - description: Бинарное содержимое файла
        in: body
        name: file
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "202":
          description: Задача успешно создана
          schema:
            $ref: '#/definitions/SwaggerCreateTaskSuccess'
        "400":
          description: Неверный формат запроса
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Ошибка при создании задачи
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Создать задачу обработки файла (streaming upload)
      tags:
      - tasks
  /api/v1/tasks/{task_id}:
    get:
      parameters:
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SwaggerGetTaskSuccess'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      tags:
      - tasks
swagger: "2.0"
